<script>
    // सचिन भाई, यहाँ अपनी नई चाबी डालें (कोट्स के अंदर)
    const MY_KEY = "AIzaSyD-ClL4NDG6A3j6rWUDJuFAV3qJ1Sym5zw"; 

    async function ask() {
        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat');
        const text = input.value.trim();

        if (!text) return;

        // आपका मैसेज स्क्रीन पर दिखाएगा
        chat.innerHTML += `<div class="msg user"><b>आप:</b> ${text}</div>`;
        input.value = "";
        chat.scrollTop = chat.scrollHeight;

        try {
            // सीधे Google के AI सर्वर से बात करने का रास्ता
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await res.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="msg ai"><b>Arth AI:</b> ${reply}</div>`;
            } else {
                chat.innerHTML += `<div class="msg ai" style="color:red;">Arth AI: भाई, Google से जवाब नहीं आया। की (Key) चेक करें!</div>`;
            }
        } catch (error) {
            chat.innerHTML += `<div class="msg ai" style="color:red;">सिस्टम बिजी है, फिर से कोशिश करें!</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
    }
</script>
