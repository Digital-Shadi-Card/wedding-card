<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arth AI | Official Dashboard</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-card { width: 90%; max-width: 450px; background: #1e293b; border-radius: 20px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid #38bdf8; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; margin: 0; font-size: 28px; text-transform: uppercase; }
        .header p { font-size: 12px; color: #94a3b8; }
        .chat-box { height: 250px; background: #0f172a; border-radius: 10px; padding: 10px; margin-bottom: 15px; overflow-y: auto; border: 1px solid #334155; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-card">
        <div class="header">
            <h1>ARTH AI</h1>
            <p>BY CEO SACHIN KUMAR</p>
        </div>
        <div class="chat-box" id="chat">
            <p style="color: #38bdf8;"><b>Arth AI:</b> नमस्ते CEO सचिन! सिस्टम ऑनलाइन है।</p>
        </div>
        <div class="input-group">
            <input type="text" id="msg" placeholder="अपना सवाल पूछें...">
            <button onclick="alert('System Link Coming Soon!')">SEND</button>
        </div>
    </div>
</body>
</html>
