<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arth AI | Official</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-card { width: 95%; max-width: 400px; background: #1e293b; border-radius: 20px; padding: 20px; border: 1px solid #38bdf8; }
        .chat-box { height: 300px; background: #0f172a; border-radius: 10px; padding: 10px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #334155; color: white; outline: none; }
        button { background: #38bdf8; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; color: #0f172a; }
        .msg { margin: 5px 0; padding: 8px 12px; border-radius: 12px; font-size: 14px; max-width: 80%; }
        .user { background: #334155; align-self: flex-end; }
        .ai { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; align-self: flex-start; }
    </style>
</head>
<body>
    <div class="chat-card">
        <h2 style="text-align:center; color:#38bdf8; margin-top:0;">ARTH AI</h2>
        <div id="chatBox" class="chat-box">
            <div class="msg ai">नमस्ते सचिन भाई! सिस्टम अब चालू है।</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="कुछ पूछें...">
            <button onclick="sendMsg()">SEND</button>
        </div>
    </div>

    <script>
        // अपनी नई चाबी यहाँ डालें
        const API_KEY = "AIzaSyD-ClL4NDG6A3j6rWUDJuFAV3qJ1Sym5zw"; 

        async function sendMsg() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            chat.innerHTML += `<div class="msg user"><b>आप:</b> ${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="msg ai"><b>Arth AI:</b> ${reply}</div>`;
            } catch (error) {
                chat.innerHTML += `<div class="msg ai" style="color:red;">एरर: अपनी Key चेक करें!</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
