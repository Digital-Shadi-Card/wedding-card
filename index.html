<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arth AI | Official Dashboard</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .chat-card { width: 95%; max-width: 450px; background: #1e293b; border-radius: 20px; padding: 20px; border: 1px solid #38bdf8; box-sizing: border-box; }
        .chat-box { height: 350px; background: #0f172a; border-radius: 10px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #334155; display: flex; flex-direction: column; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; background: #334155; color: white; outline: none; font-size: 16px; }
        button { background: #38bdf8; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; color: #0f172a; }
        .msg { margin: 8px 0; padding: 10px 14px; border-radius: 15px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .user { background: #334155; align-self: flex-end; color: white; }
        .ai { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; align-self: flex-start; }
    </style>
</head>
<body>
    <div class="chat-card">
        <div style="text-align: center; margin-bottom: 15px;">
            <h1 style="color: #38bdf8; margin:0; font-size: 24px;">ARTH AI</h1>
            <p style="font-size: 11px; color: #94a3b8; margin: 5px 0;">CREATOR: CEO SACHIN KUMAR</p>
        </div>
        <div id="chat" class="chat-box">
            <div class="msg ai"><b>Arth AI:</b> नमस्ते CEO सचिन! मैं समस्तीपुर का अपना AI हूँ। पूछिए, क्या मदद करूँ?</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="मुझसे कुछ भी पूछें...">
            <button onclick="ask()">SEND</button>
        </div>
    </div>
    <script>
        // अपनी नई वाली API Key यहाँ नीचे पेस्ट करें
        const KEY = AIzaSyDBgupCcRadbVqh2Pi252KBL1NE3U6IzsE

        async function ask() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if(!text) return;

            chat.innerHTML += `<div class="msg user"><b>आप:</b> ${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });
                const data = await res.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chat.innerHTML += `<div class="msg ai"><b>Arth AI:</b> ${reply}</div>`;
                } else {
                    throw new Error();
                }
                chat.scrollTop = chat.scrollHeight;
            } catch (e) {
                chat.innerHTML += `<div class="msg ai" style="color:red;">सिस्टम अभी बिजी है, कृपया अपनी API Key चेक करें!</div>`;
            }
        }
    </script>
</body>
</html>
